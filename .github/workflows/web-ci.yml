name: web-ci

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [main]
    paths:
      - "web/**"

jobs:
  test:
    name: Typecheck + Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      # ⛔ AGAIN IN ANOTHER TIMEZONE. The runner is UTC and the laptop is Athens, so a test that
      # builds a date in the process's zone and asserts that same zone back agrees with itself
      # everywhere and pins nothing. Four such tests only came apart when a formatter was given a
      # zone by name, and then they failed here and nowhere else. Running the suite twice, once in
      # the owner's own zone, is what stops "green on my machine" for anything touching a clock.
      - name: Unit tests, in the owner's timezone
        run: TZ=Europe/Athens npx vitest run

  lint:
    # The lint-to-zero campaign (soma#958) is finished: the cap is 0, every rule is an error,
    # and a PR that adds a finding fails here.
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: eslint (zero findings)
        run: npx eslint . --max-warnings 0

  build-without-db:
    # `next build` must never need a database (soma#940). The production DATABASE_URL names the
    # estate gateway host, which no socket can resolve; a build-time query took every production
    # deploy down from 2026-09-09 to 2026-09-13 while the PR checks (no DATABASE_URL) stayed green.
    # This job builds with an unreachable host so a build-time query fails the PR, not production.
    name: Build without a database
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build against an unreachable gateway host
        env:
          DATABASE_URL: postgresql://soma_ro:x@pg.example.invalid/soma
          AUTH_SECRET: ci-build-only
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
        run: npm run build
