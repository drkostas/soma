name: Sync Health Data

on:
  schedule:
    - cron: '0 0-3,10-23 * * *'    # Hourly, 6am-midnight EDT (UTC-4)
    - cron: '0 4 * * *'           # Midnight EDT
  workflow_dispatch: {}  # Manual trigger from GitHub UI
  repository_dispatch:
    types: [sync-trigger]  # Trigger from API route

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # This repository runs the pipeline on its own machine instead, as a launchd job, because that
    # is where its database lives. Two schedulers running the same sync would duplicate every step
    # and notify twice.
    #
    # ⭐ THE SCHEDULE STAYS IN THE FILE ON PURPOSE. A fork is meant to deploy on Vercel with a
    # hosted database and rely on exactly this workflow, so removing the cron would quietly break
    # the path this project documents. The skip is a repository variable that only this instance
    # sets; a fork has no such variable and runs normally. Manual and API triggers always run,
    # here as well, because those are someone asking for it deliberately.
    #
    # ⛔ THIS GUARD BELONGS ON THE JOB, NOT ON A STEP. It was first written as a step that echoed
    # and called `exit 0`, which ends that STEP successfully and does nothing to the ones after it
    # — checkout, install and the pipeline itself all still ran, so the skip skipped nothing and
    # both schedulers would have synced the same database. A step cannot end its job.
    if: >-
      !(github.event_name == 'schedule' && vars.PIPELINE_RUNS_LOCALLY == 'true')

    steps:
      - name: Additive backoff — skip if too soon after a failure
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Additive backoff: 1st real fail → 1h, 2nd → 3h, 3rd → 5h ... cap 24h.
          # "Real" failures = runs that lasted > 30s (actual pipeline attempts).
          # Backoff skips last < 15s and are excluded from the count so they
          # don't inflate the window. Manual triggers bypass entirely.

          RUNS=$(gh run list --workflow=sync.yml --status=completed --limit=30 \
            --json conclusion,createdAt,updatedAt \
            --jq '[.[] | select(.conclusion == "success" or .conclusion == "failure")]' \
            2>/dev/null || echo "[]")

          python3 -c "
          import json, sys
          from datetime import datetime, timezone, timedelta

          runs = json.loads('''$RUNS''')
          if not runs:
              sys.exit(0)

          def parse_ts(s):
              return datetime.fromisoformat(s.replace('Z', '+00:00'))

          def duration_s(r):
              return (parse_ts(r['updatedAt']) - parse_ts(r['createdAt'])).total_seconds()

          # Count consecutive REAL failures (duration > 30s).
          # Skip over short runs (backoff skips) — they don't count either way.
          consecutive = 0
          last_real_failure_at = None
          for r in runs:
              dur = duration_s(r)
              if dur < 30:
                  continue  # backoff skip, ignore
              if r['conclusion'] == 'failure':
                  consecutive += 1
                  if last_real_failure_at is None:
                      last_real_failure_at = parse_ts(r['createdAt'])
              else:
                  break  # hit a real success, stop counting

          if consecutive == 0 or last_real_failure_at is None:
              sys.exit(0)  # no real failures, proceed

          backoff_h = min(2 * consecutive - 1, 24)
          elapsed = datetime.now(timezone.utc) - last_real_failure_at
          remaining = timedelta(hours=backoff_h) - elapsed

          if remaining.total_seconds() > 0:
              h = remaining.total_seconds() / 3600
              print(f'::notice::Backoff: {consecutive} real failure(s), waiting {backoff_h}h ({h:.1f}h left). Manual trigger bypasses.')
              sys.exit(1)  # fail fast — keeps this run short so it's excluded from future counts

          print(f'::notice::Backoff expired ({backoff_h}h window, {elapsed.total_seconds()/3600:.1f}h elapsed). Retrying.')
          "

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # Runs the TypeScript sync pipeline (#187 cutover — replaced
      # `python -m src.pipeline`). Composes the same ported lib functions the
      # Vercel crons use; no Vercel involvement → no 300s function limit.
      - name: Run sync pipeline (TS — auto-detects stale dates)
        working-directory: web
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRIGGERED_BY: ${{ github.event_name }}
          SOMA_WEB_URL: ${{ secrets.SOMA_WEB_URL }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.SOMA_WEB_URL }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          MERGE_MODE: ${{ secrets.MERGE_MODE }}
          # IANA zone stamped into the uploaded FIT's local_timestamp so Garmin
          # forwards the correct local time to Strava (not raw UTC).
          HEVY2GARMIN_TIMEZONE: Europe/Athens
        run: npx tsx scripts/sync-pipeline.mts
