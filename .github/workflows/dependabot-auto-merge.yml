name: Dependabot auto-merge

# Merges a Dependabot pull request on its own, but only when it is a direct
# development dependency and the bump is patch level. Everything larger (a minor
# or major bump, or a runtime dependency) still waits for a human. Auto-merge
# queues the merge, so it only happens once every required check is green.

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Read Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2

      - name: Queue auto-merge for dev-dependency patch bumps
        if: steps.meta.outputs.dependency-type == 'direct:development' && steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
