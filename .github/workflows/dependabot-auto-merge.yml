name: Dependabot auto-merge

# Merges a Dependabot pull request on its own, but only when every bumped package is a
# direct development dependency and the bump is patch level. Everything larger (a minor
# or major bump, or a runtime dependency) still waits for a human.
#
# The development-dependency check reads the base branch's package.json for each changed
# directory, so it is accurate even when the bump only touches the lockfile (which
# Dependabot labels as an "indirect" update, for example an in-range security patch). It
# reads base-branch files only and never checks out pull-request code. If it cannot
# confirm that every bumped package is a development dependency, it holds the pull request
# for manual review. Auto-merge queues the merge, so it only happens once every required
# check is green.

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Read Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v2

      - name: Confirm every bump is a direct development dependency
        id: gate
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
          DEPS: ${{ steps.meta.outputs.dependency-names }}
        run: |
          set -uo pipefail
          mapfile -t files < <(gh pr view "$PR" --repo "$REPO" --json files -q '.files[].path' | grep -E '(^|/)package(-lock)?\.json$' || true)
          if [ "${#files[@]}" -eq 0 ]; then echo "devpatch=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          dirs=$(printf '%s\n' "${files[@]}" | xargs -n1 dirname | sort -u)
          all_dev=true
          for dep in ${DEPS//,/ }; do
            dep_dev=false
            for d in $dirs; do
              path="package.json"; [ "$d" = "." ] || path="$d/package.json"
              pj=$(gh api "repos/$REPO/contents/$path?ref=$BASE_SHA" -q '.content' 2>/dev/null | base64 -d 2>/dev/null || true)
              [ -z "$pj" ] && continue
              if printf '%s' "$pj" | jq -e --arg x "$dep" '(.dependencies // {})[$x] != null' >/dev/null 2>&1; then all_dev=false; break; fi
              if printf '%s' "$pj" | jq -e --arg x "$dep" '(.devDependencies // {})[$x] != null' >/dev/null 2>&1; then dep_dev=true; fi
            done
            $all_dev || break
            $dep_dev || { all_dev=false; break; }
          done
          echo "devpatch=$all_dev" >> "$GITHUB_OUTPUT"

      - name: Queue auto-merge for development-dependency patch bumps
        if: steps.gate.outputs.devpatch == 'true'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
